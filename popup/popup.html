<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ollie</title>
    <link rel="stylesheet" href="../content/overlay.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div>
          <h1>Ollie</h1>
          <p class="subtitle">Focus companion</p>
        </div>
        <div class="companion-mark" id="companion-mark"></div>
      </header>

      <section class="session-card" id="session-card">
        <p class="phase-label" id="phase-label">Ready when you are</p>
        <p class="timer" id="timer">25:00</p>
        <p class="current-task" id="current-task">Choose one thing to finish.</p>
        <p class="commentary-status" id="commentary-status" hidden></p>
      </section>

      <form id="session-form">
        <label class="task-label" for="task">What are you working on? <span>(optional)</span></label>
        <textarea
          id="task"
          name="task"
          maxlength="240"
          placeholder="e.g. Finish the onboarding flow"
        ></textarea>

        <div class="duration-grid">
          <label>
            Focus
            <span class="number-field">
              <input id="focus-minutes" name="focusMinutes" type="number" min="1" max="180" value="25" required>
              <span>min</span>
            </span>
          </label>
          <label>
            Break
            <span class="number-field">
              <input id="break-minutes" name="breakMinutes" type="number" min="1" max="60" value="5" required>
              <span>min</span>
            </span>
          </label>
        </div>

        <p class="error-message" id="error-message" hidden></p>

        <div class="actions">
          <button class="primary-button" id="start-button" type="submit">Start focus</button>
          <button class="secondary-button" id="stop-button" type="button" hidden>Stop session</button>
        </div>
      </form>

      <form class="api-key-card" id="api-key-form">
        <div class="api-key-heading">
          <label for="api-key">OpenAI API key</label>
          <span class="api-key-status" id="api-key-status">No key saved</span>
        </div>
        <input
          autocomplete="off"
          id="api-key"
          maxlength="512"
          name="apiKey"
          placeholder="Paste a key to enable task-aware lines"
          type="password"
        >
        <p class="api-key-note">Stored locally on this device and read only by Ollie's background worker.</p>
        <div class="api-key-actions">
          <button class="primary-button" id="save-api-key" type="submit">Save key</button>
          <button class="text-button" id="remove-api-key" type="button" hidden>Remove key</button>
        </div>
      </form>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
